<header class="page-head"><div class="eyebrow">Unit 3 · Network Devices and Protocols</div><h1><span class="num">3.3.2</span>DHCP and the DORA process</h1></header><article class="prose"><p>A client with no address broadcasts <strong>D</strong>iscover; the server replies <strong>O</strong>ffer; the client sends <strong>R</strong>equest; the server sends <strong>A</strong>cknowledgement carrying the IP address, mask, gateway, DNS server and lease time.</p>
