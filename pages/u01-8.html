<header class="page-head"><div class="eyebrow">Unit 1 · Data Communication Fundamentals</div><h1><span class="num">1.8</span>Error detection basics</h1></header><article class="prose"><p>Noise can flip bits. Common detection methods: <strong>parity bit</strong>, <strong>checksum</strong> and <strong>Cyclic Redundancy Check (CRC)</strong>. Ethernet uses CRC in its frame trailer; if the check fails, the frame is discarded and higher layers (TCP) may retransmit.</p>
<figure class="fig"><svg class="" viewBox="0 0 700 220" role="img" aria-label="Cyclic redundancy check on an Ethernet frame" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah2563eb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="20" y="50" width="150" height="76" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="95" y="77.4375" class="t" font-size="13.5" fill="#2563eb" text-anchor="middle" font-weight="700">Sender</text><text x="95" y="94.1125" class="t" font-size="11.5" fill="#64748b" text-anchor="middle">calculates CRC from</text><text x="95" y="109.062" class="t" font-size="11.5" fill="#64748b" text-anchor="middle">header + data</text><path d="M172 88 L206 88" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2563eb)"/><rect x="210" y="68" width="80" height="40" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="250" y="92.375" class="t" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">Header</text><rect x="290" y="68" width="130" height="40" rx="9" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/><text x="355" y="92.375" class="t" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="700">Data</text><rect x="420" y="68" width="70" height="40" rx="9" fill="#ea580c" stroke="#ea580c" stroke-width="1.6"/><text x="455" y="92.375" class="t" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">CRC</text><text x="350" y="132" class="t" font-size="11.5" fill="#64748b" text-anchor="middle" font-style="italic">noise may flip bits on the way</text><path d="M492 88 L526 88" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah2563eb)"/><rect x="530" y="50" width="150" height="76" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="605" y="77.4375" class="t" font-size="13.5" fill="#7c3aed" text-anchor="middle" font-weight="700">Receiver</text><text x="605" y="94.1125" class="t" font-size="11.5" fill="#64748b" text-anchor="middle">recalculates CRC</text><text x="605" y="109.062" class="t" font-size="11.5" fill="#64748b" text-anchor="middle">and compares</text><rect x="528.88" y="149" width="152.24" height="22" rx="11" fill="#059669" stroke="#059669" stroke-width="1.4"/><text x="605" y="164.32" class="t" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">match: accept frame</text><rect x="521.92" y="183" width="166.16" height="22" rx="11" fill="#dc2626" stroke="#dc2626" stroke-width="1.4"/><text x="605" y="198.32" class="t" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">differ: discard frame</text></svg><figcaption>Error detection with CRC: the sender adds a check value; the receiver recalculates it and discards the frame if they differ</figcaption></figure></article>
