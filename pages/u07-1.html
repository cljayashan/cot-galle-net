<header class="page-head"><div class="eyebrow">Unit 7 · Domain Name System (DNS)</div><h1><span class="num">7.1</span>Why DNS?</h1></header><article class="prose"><p>People remember names (<code>www.example.com</code>), computers route by IP addresses (<code>93.184.216.34</code>). <strong>DNS</strong> is a distributed, hierarchical database that translates names to IP addresses (and back), and it also stores mail routing and other information.</p>
